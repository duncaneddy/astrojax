name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/**'

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Cache brahe data (SPICE kernels)
        uses: actions/cache@v6
        with:
          path: ~/.cache/brahe
          key: brahe-data-${{ runner.os }}-v1

      - name: Pre-download SPICE kernels
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            uv run python -c "import brahe; brahe.load_common_spice_kernels()" && exit 0
            if [ "$i" -lt 5 ]; then
              echo "Kernel download attempt $i failed; retrying in $((i * 15))s"
              sleep $((i * 15))
            fi
          done
          echo "Kernel download failed after 5 attempts"
          exit 1

      - name: Run tests
        run: uv run pytest -v --cov=astrojax --cov-report=xml --cov-report=term-missing --junitxml=junit.xml -o junit_family=legacy

      # - name: Upload coverage to Coveralls
      #   if: ${{ !cancelled() && matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest' }}
      #   uses: coverallsapp/github-action@v2
      #   with:
      #     file: ./coverage.xml
      #     github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: duncaneddy/astrojax

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest' }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
